<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Produk Premium | Farid Store</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet"/>
<style>
    :root {
        --primary: #7367f0;
        --primary2: #9b8cfb;
        --bg: #f4f7ff;
        --card: #ffffff;
        --border: #e9ecf4;
        --text: #1f2937;
        --muted: #6b7280;
        --success: #16a34a;
        --danger: #ef4444;
        --warning: #f59e0b;
        --shadow: 0 10px 40px rgba(31,41,55,.08);
        --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: Inter, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }

    /* === Header & Breadcrumb === */
    header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
        padding: 30px 24px;
        color: white;
        box-shadow: 0 4px 20px rgba(115, 103, 240, 0.25);
    }
    .header-content {
        max-width: 1200px;
        margin: 0 auto;
    }
    .header-content h2 { margin: 0; font-size: 1.8rem; font-weight: 800; }
    .breadcrumb { opacity: 0.9; font-size: 0.9rem; margin-top: 8px; font-weight: 500; }

    /* === Main Container === */
    .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 24px 80px;
    }

    /* === Search Bar === */
    .search-wrapper {
        position: relative;
        max-width: 400px;
        margin-bottom: 30px;
    }
    .search-wrapper i {
        position: absolute;
        top: 50%;
        left: 18px;
        transform: translateY(-50%);
        color: #888;
    }
    .search-input {
        padding: 14px 20px 14px 48px;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 16px;
        font-size: 1rem;
        background: #fff;
        transition: all 0.3s ease;
    }
    .search-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(115, 103, 240, 0.12);
    }

    /* === Grid Produk === */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
        gap: 24px;
    }
    .no-results {
        text-align: center; color: var(--muted); grid-column: 1 / -1; padding: 40px 0;
    }

    /* === Card Animasi === */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .card {
        animation: fadeInUp 0.5s ease forwards;
        background: var(--card); 
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px; 
        text-align: center;
        display: flex; flex-direction: column; justify-content: space-between;
        cursor: pointer; transition: all 0.3s ease;
        border: 1px solid var(--border);
    }
    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 15px 35px rgba(115, 103, 240, 0.15);
        border-color: var(--primary);
    }
    .card img {
        width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
        border-radius: 14px; background: #f8f9fa; margin-bottom: 15px;
    }
    .card h4 {
        margin: 0 0 8px 0; font-size: 1rem; flex-grow: 1;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700;
    }
    .price-tag {
        font-weight: 800; color: var(--primary); font-size: 1.1rem; margin-bottom: 12px;
    }
    .status {
        padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;
        display: inline-block;
    }
    .status.ready { background-color: #eefcf4; color: var(--success); }
    .status.pending { background-color: #fffbeb; color: var(--warning); }

    /* === Modal === */
    .modal {
        display: none; position: fixed; inset: 0;
        background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(6px);
        justify-content: center; align-items: center;
        padding: 20px; z-index: 1000; opacity: 0; transition: opacity 0.3s ease;
    }
    .modal.show { display: flex; opacity: 1; }
    
    .modal-content {
        background: #fff; border-radius: 26px; box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        max-width: 850px; width: 100%; max-height: 90vh; overflow-y: auto;
        padding: 34px; position: relative; transform: scale(0.95); transition: transform 0.3s ease;
    }
    .modal.show .modal-content { transform: scale(1); }

    .modal-close {
        position: absolute; top: 20px; right: 24px; font-size: 24px;
        background: none; border: none; cursor: pointer; color: #888; transition: 0.3s;
    }
    .modal-close:hover { color: var(--danger); transform: rotate(90deg); }

    .modal-body { display: flex; gap: 30px; flex-wrap: wrap; }
    
    /* Kiri: Gambar & Payment Viewer */
    .modal-image-wrapper { flex: 1 1 280px; display: flex; flex-direction: column; align-items: center; }
    .modal-image-wrapper img.prod-img { 
        width: 100%; max-width: 250px; border-radius: 20px; 
        object-fit: contain; background: #f8f9fa; margin-bottom: 25px; 
        border: 1px solid var(--border);
    }
    
    /* View QRIS Box */
    .qris-box {
        background: white; padding: 20px; border-radius: 24px;
        border: 1px solid var(--border); box-shadow: var(--shadow);
        text-align: center; width: 100%; max-width: 250px;
    }
    #qrcode { display: flex; justify-content: center; align-items: center; margin: 0 auto; }
    .qris-hint { font-size: 0.8rem; color: var(--muted); margin-top: 12px; font-weight: 700; }

    /* View Transfer Manual Box */
    .payment-account {
        padding: 22px; border-radius: 24px; background: #f8faff;
        border: 1px solid var(--border); width: 100%; max-width: 250px;
        text-align: center; display: none;
    }
    .payment-account small { color: var(--muted); font-weight: 600; }
    .payment-account h4 { margin-top: 5px; font-size: 1.1rem; }
    .rekening-number { font-size: 1.4rem; font-weight: 800; margin: 16px 0; color: var(--primary); }
    .copy-btn {
        width: 100%; height: 48px; border: none; border-radius: 14px;
        cursor: pointer; font-weight: 700; background: var(--primary); color: white; transition: 0.3s;
    }
    .copy-btn:hover { background: var(--primary2); }

    /* Kanan: Detail & Form */
    .modal-details { flex: 1 1 350px; display: flex; flex-direction: column; }
    .modal-details h3 { margin: 0; font-size: 1.6rem; color: #1f2937; font-weight: 800; }
    .modal-details .modal-price { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin: 8px 0 20px 0; }
    
    .modal-details label { font-weight: 700; margin-top: 16px; color: #374151; font-size: 0.95rem; display: block; margin-bottom: 8px; }
    
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .modal-details select, .modal-details input {
        padding: 0 16px; height: 50px; font-size: 0.95rem;
        border-radius: 14px; border: 1px solid var(--border); transition: all 0.3s;
        box-sizing: border-box; width: 100%; background: #fff;
    }
    .modal-details select:focus, .modal-details input:focus {
        outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(115, 103, 240, 0.12);
    }

    /* Opsi Pembayaran UI */
    .payment-selector {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 5px;
    }
    .payment-card {
        border: 2px solid var(--border); border-radius: 18px; padding: 15px;
        cursor: pointer; transition: 0.3s; text-align: center; background: #fff;
    }
    .payment-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,.05); }
    .payment-card.active { border-color: var(--primary); background: #f8f7ff; }
    .payment-card h5 { margin-top: 10px; font-size: 0.9rem; font-weight: 700; }
    
    .icon-circle {
        width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin: 0 auto;
    }
    .icon-qris { background: #eef2ff; color: var(--primary); }
    .icon-bank { background: #eefcf4; color: var(--success); }

    .manual-list {
        display: none; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; margin-top: 15px;
    }
    .manual-list.show { display: grid; }
    .manual-item {
        border: 1px solid var(--border); border-radius: 14px; padding: 12px;
        cursor: pointer; transition: 0.3s; text-align: center; background: #fff;
    }
    .manual-item:hover { transform: translateY(-2px); }
    .manual-item.active { border-color: var(--primary); background: #f7f6ff; }
    .manual-item i { font-size: 20px; margin-bottom: 8px; color: var(--primary); }
    .manual-item h6 { font-size: 0.8rem; font-weight: 700; margin: 0; }

    /* Total & Submit */
    .total-calc {
        background: #f8f9fa; border: 2px dashed var(--primary2); padding: 16px; border-radius: 16px;
        margin-top: 25px; text-align: center; font-size: 1.2rem; font-weight: 800; color: #1f2937;
    }

    .btn-submit {
        margin-top: 20px; height: 56px; font-size: 1.05rem; font-weight: 700;
        background: linear-gradient(135deg, var(--primary), var(--primary2));
        color: white; border: none; border-radius: 16px;
        cursor: pointer; transition: all 0.3s ease;
        box-shadow: 0 15px 35px rgba(115,103,240,.25);
    }
    .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 20px 40px rgba(115,103,240,.35); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .status-message { margin-top: 15px; font-weight: 600; text-align: center; font-size: 0.9rem; }
    .loading-state { text-align: center; padding: 40px; color: var(--muted); grid-column: 1 / -1; font-weight: 600; }

    /* === Toast === */
    .toast {
        position: fixed; top: 30px; right: 30px; background: white;
        border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.12);
        padding: 18px 24px; transform: translateX(150%); transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        z-index: 9999; font-weight: 600; display: flex; align-items: center; gap: 12px;
    }
    .toast.show { transform: translateX(0); }

    /* Responsive */
    @media (max-width: 768px) {
        .modal-body { flex-direction: column; gap: 20px; }
        .modal-content { padding: 24px; border-radius: 20px; }
        .modal-image-wrapper { flex: 1 1 auto; }
        .input-row { grid-template-columns: 1fr; }
        .qris-box, .payment-account { max-width: 100%; }
        .header-content h2 { font-size: 1.5rem; }
    }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>
    <div class="header-content">
        <h2>Aplikasi Premium</h2>
        <p class="breadcrumb">Prabayar &gt; Aplikasi & Jasa Premium</p>
    </div>
</header>

<div class="container">
    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Cari aplikasi atau layanan..." id="searchInput" class="search-input" />
    </div>
    
    <div id="productList" class="grid">
        <div class="loading-state"><i class="fas fa-spinner fa-spin fa-2x mb-3 block" style="margin-bottom:12px;"></i><br>Memuat Katalog Harga...</div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <button id="closeModal" class="modal-close"><i class="fas fa-times"></i></button>
        <div class="modal-body">
            
            <div class="modal-image-wrapper">
                <img id="modalImage" class="prod-img" src="" alt="Produk" />
                
                <div id="view-qris" class="qris-box">
                    <div id="qrcode"></div>
                    <div class="qris-hint"><i class="fas fa-qrcode"></i> QRIS OTOMATIS FARID STORE</div>
                </div>

                <div id="view-manual" class="payment-account">
                    <small>Atas Nama</small>
                    <h4>Farid Ja'far Siddiq</h4>
                    <div class="rekening-number" id="rekening-number">-</div>
                    <button class="copy-btn" id="copy-btn"><i class="fas fa-copy"></i> Copy Rekening</button>
                </div>
            </div>
            
            <div class="modal-details">
                <h3 id="modalName">Nama Produk</h3>
                <div id="modalPrice" class="modal-price">Rp0</div>

                <div class="input-row">
                    <div>
                        <label for="periodSelect">Periode:</label>
                        <select id="periodSelect">
                            <option value="1hari">1 Hari</option>
                            <option value="7hari">7 Hari</option>
                            <option value="1bulan">1 Bulan</option>
                            <option value="3bulan">3 Bulan</option>
                            <option value="12bulan">12 Bulan</option>
                        </select>
                    </div>
                    <div>
                        <label for="quantityInput">Jumlah:</label>
                        <input type="number" id="quantityInput" min="1" value="1" />
                    </div>
                </div>

                <label for="contactInput">Kontak (WA/Email):</label>
                <input type="text" id="contactInput" placeholder="0812xxxx atau email@email.com" />

                <label>Metode Pembayaran:</label>
                <div class="payment-selector">
                    <div class="payment-card active" id="card-qris">
                        <div class="icon-circle icon-qris"><i class="fas fa-qrcode"></i></div>
                        <h5>QRIS Otomatis</h5>
                    </div>
                    <div class="payment-card" id="card-manual">
                        <div class="icon-circle icon-bank"><i class="fas fa-university"></i></div>
                        <h5>Transfer Manual</h5>
                    </div>
                </div>

                <div class="manual-list" id="manual-list">
                    <div class="manual-item" data-method="dana"><i class="fas fa-wallet"></i><h6>DANA</h6></div>
                    <div class="manual-item" data-method="gopay"><i class="fas fa-wallet"></i><h6>Gopay</h6></div>
                    <div class="manual-item" data-method="seabank"><i class="fas fa-university"></i><h6>SeaBank</h6></div>
                    <div class="manual-item" data-method="bank-bsi"><i class="fas fa-university"></i><h6>BSI</h6></div>
                    <div class="manual-item" data-method="bank-jago"><i class="fas fa-university"></i><h6>Jago</h6></div>
                    <div class="manual-item" data-method="bank-mandiri"><i class="fas fa-university"></i><h6>Mandiri</h6></div>
                </div>

                <div class="total-calc">
                    Total Tagihan: <span id="totalDisplay">Rp0</span>
                </div>

                <button id="submitOrder" class="btn-submit">Kirim Pesanan</button>
                <p id="statusMessage" class="status-message"></p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
    /* =========================
       DATA & ELEMEN DOM
    ========================= */
    const paymentData = {
        dana: { name: "DANA", rekening: "081233014523" },
        gopay: { name: "Gopay", rekening: "081233014523" },
        seabank: { name: "SeaBank", rekening: "901203701880" },
        "bank-bsi": { name: "Bank BSI", rekening: "7211388627" },
        "bank-jago": { name: "Bank Jago", rekening: "105140476589" },
        "bank-mandiri": { name: "Bank Mandiri", rekening: "1080028958644" }
    };

    const productList = document.getElementById("productList");
    const searchInput = document.getElementById("searchInput");
    const modal = document.getElementById("modal");
    
    // Form Elements
    const modalImage = document.getElementById("modalImage");
    const modalName = document.getElementById("modalName");
    const modalPrice = document.getElementById("modalPrice");
    const periodSelect = document.getElementById("periodSelect");
    const quantityInput = document.getElementById("quantityInput");
    const contactInput = document.getElementById("contactInput");
    const totalDisplay = document.getElementById("totalDisplay");
    const submitOrder = document.getElementById("submitOrder");
    const statusMessage = document.getElementById("statusMessage");

    // Payment Elements
    const cardQris = document.getElementById("card-qris");
    const cardManual = document.getElementById("card-manual");
    const manualList = document.getElementById("manual-list");
    const manualItems = document.querySelectorAll(".manual-item");
    const viewQris = document.getElementById("view-qris");
    const viewManual = document.getElementById("view-manual");
    const rekeningNumber = document.getElementById("rekening-number");
    const copyBtn = document.getElementById("copy-btn");
    const toast = document.getElementById("toast");

    let items = [];
    let currentProduct = null;
    let qrEngine = null;
    let selectedMethod = "QRIS";
    let selectedManualKey = "";

    function formatRupiah(number) {
        return "Rp" + number.toLocaleString("id-ID");
    }

    /* =========================
       TOAST NOTIFICATION
    ========================= */
    function showToast(message, type="success") {
        toast.innerHTML = type === "success" 
            ? `<i class="fas fa-check-circle" style="color:#16a34a; font-size:1.2rem;"></i> ${message}`
            : `<i class="fas fa-exclamation-circle" style="color:#ef4444; font-size:1.2rem;"></i> ${message}`;
        
        toast.style.borderLeft = type === "error" ? "6px solid #ef4444" : "6px solid #16a34a";
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2500);
    }

    /* =========================
       PAYMENT SELECTOR LOGIC
    ========================= */
    function activateQRIS() {
        selectedMethod = "QRIS";
        selectedManualKey = "";
        
        cardQris.classList.add("active");
        cardManual.classList.remove("active");
        manualList.classList.remove("show");
        
        viewQris.style.display = "block";
        viewManual.style.display = "none";
        
        calculateTotal(); // Update QR based on total
    }

    function activateManual() {
        selectedMethod = "Manual";
        selectedManualKey = "";
        
        cardManual.classList.add("active");
        cardQris.classList.remove("active");
        manualList.classList.add("show");
        
        viewQris.style.display = "none";
        viewManual.style.display = "block";
        
        rekeningNumber.innerHTML = "Pilih metode";
        manualItems.forEach(x => x.classList.remove("active"));
    }

    cardQris.addEventListener("click", activateQRIS);
    cardManual.addEventListener("click", activateManual);

    manualItems.forEach(item => {
        item.addEventListener("click", () => {
            manualItems.forEach(x => x.classList.remove("active"));
            item.classList.add("active");
            
            const methodKey = item.dataset.method;
            selectedManualKey = methodKey;
            selectedMethod = paymentData[methodKey].name;
            rekeningNumber.innerHTML = paymentData[methodKey].rekening;
        });
    });

    copyBtn.addEventListener("click", async () => {
        const text = rekeningNumber.innerText;
        if (!text || text === "Pilih metode") {
            showToast("Pilih rekening bank dahulu", "error");
            return;
        }
        try {
            await navigator.clipboard.writeText(text);
            copyBtn.innerHTML = `<i class="fas fa-check"></i> Tersalin`;
            showToast("Nomor rekening berhasil disalin");
            setTimeout(() => {
                copyBtn.innerHTML = `<i class="fas fa-copy"></i> Copy Rekening`;
            }, 1800);
        } catch {
            showToast("Gagal menyalin rekening", "error");
        }
    });

    /* =========================
       QRIS GENERATOR
    ========================= */
    function crc16(str) {
        let crc = 0xFFFF;
        for (let i = 0; i < str.length; i++) {
            crc ^= str.charCodeAt(i) << 8;
            for (let j = 0; j < 8; j++) {
                if ((crc & 0x8000) !== 0) {
                    crc = (crc << 1) ^ 0x1021;
                } else {
                    crc <<= 1;
                }
                crc &= 0xFFFF;
            }
        }
        return crc.toString(16).toUpperCase().padStart(4, '0');
    }

    function buildQRIS(amount) {
        const tag00 = "000201", tag01 = "010212";
        const tag26 = "26570011ID.DANA.WWW011893600915300002827902090000282790303UMI";
        const tag51 = "51440014ID.CO.QRIS.WWW0215ID10265066640140303UMI";
        const tag52 = "52044814", tag53 = "5303360";
        const amountStr = amount.toString();
        const tag54 = "54" + amountStr.length.toString().padStart(2, '0') + amountStr;
        const tag58 = "5802ID", tag59 = "5911Farid Store", tag60 = "6014Kota Pekanbaru";
        const tag61 = "610528294", tag63 = "6304";
        
        const raw = tag00 + tag01 + tag26 + tag51 + tag52 + tag53 + tag54 + tag58 + tag59 + tag60 + tag61 + tag63;
        return raw + crc16(raw);
    }

    function calculateTotal() {
        if (!currentProduct) return;
        const qty = parseInt(quantityInput.value) || 1;
        const total = currentProduct.price * qty;
        totalDisplay.innerText = formatRupiah(total);

        // Update QRIS jika mode QRIS aktif
        if (selectedMethod === "QRIS" && total > 0) {
            const qrisPayload = buildQRIS(total);
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";
            qrEngine = new QRCode(qrContainer, {
                text: qrisPayload,
                width: 200,
                height: 200,
                colorDark : "#1f2937",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
        }
    }

    /* =========================
       PRODUK & MODAL LOGIC
    ========================= */
    async function loadProducts() {
        try {
            // Simulasi data jika tidak ada API backend saat ini
            const response = await fetch('/api/products').catch(() => null);
            let data = null;
            
            if (response && response.ok) {
                data = await response.json();
                items = data.record || data;
            } else {
                // Fallback dummy data jika fetch gagal untuk testing UI
                items = [
                    { id: 1, name: "Netflix Premium", price: 35000, img: "https://via.placeholder.com/300/E50914/FFFFFF?text=Netflix", status: "ready" },
                    { id: 2, name: "Spotify Premium", price: 25000, img: "https://via.placeholder.com/300/1DB954/FFFFFF?text=Spotify", status: "ready" },
                    { id: 3, name: "Canva Pro", price: 15000, img: "https://via.placeholder.com/300/00C4CC/FFFFFF?text=Canva", status: "pending" }
                ];
            }
            renderProducts();
        } catch (error) {
            productList.innerHTML = `<p class="no-results"><i class="fas fa-exclamation-triangle fa-2x"></i><br>Gagal memuat katalog.</p>`;
        }
    }

    function renderProducts(filter = "") {
        productList.innerHTML = "";
        const filtered = items.filter(item => item.name.toLowerCase().includes(filter.toLowerCase()));
        
        if (filtered.length === 0) {
            productList.innerHTML = '<p class="no-results"><i class="fas fa-box-open fa-2x mb-2 block"></i><br>Produk tidak ditemukan.</p>';
            return;
        }
        
        filtered.forEach((item) => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img src="${item.img}" alt="${item.name}" loading="lazy" />
                <h4>${item.name}</h4>
                <div class="price-tag">${formatRupiah(item.price)}</div>
                <div><span class="status ${item.status}">${item.status === "ready" ? "Ready" : "Pending"}</span></div>
            `;
            card.addEventListener("click", () => openModal(item));
            productList.appendChild(card);
        });
    }

    function openModal(product) {
        currentProduct = product;
        modalImage.src = product.img;
        modalName.textContent = product.name;
        modalPrice.textContent = formatRupiah(product.price);
        
        periodSelect.value = "1bulan";
        quantityInput.value = 1;
        
        const savedContact = localStorage.getItem("user_contact_app");
        contactInput.value = savedContact ? savedContact : "";
        
        activateQRIS(); // Default ke QRIS saat modal dibuka
        
        statusMessage.textContent = "";
        submitOrder.innerHTML = "Kirim Pesanan";
        submitOrder.disabled = false;
        
        modal.classList.add("show");
    }

    function closeModalFunc() { modal.classList.remove("show"); }
    document.getElementById("closeModal").addEventListener("click", closeModalFunc);
    window.addEventListener("click", e => { if (e.target === modal) closeModalFunc(); });

    quantityInput.addEventListener("input", calculateTotal);
    periodSelect.addEventListener("change", calculateTotal);

    function parsePeriod(value) {
        const match = value.match(/^(\d+)([a-zA-Z]+)$/);
        return match ? `${match[1]} ${match[2].charAt(0).toUpperCase() + match[2].slice(1)}` : value;
    }

    /* =========================
       SUBMIT ORDER
    ========================= */
    submitOrder.addEventListener("click", async () => {
        const quantity = parseInt(quantityInput.value) || 1;
        const contact = contactInput.value.trim();
        const totalPrice = formatRupiah(currentProduct.price * quantity);

        if (!contact) {
            showToast("Mohon isi kontak Anda", "error"); return;
        }
        if (selectedMethod === "Manual" && !selectedManualKey) {
            showToast("Pilih rekening transfer manual", "error"); return;
        }

        localStorage.setItem("user_contact_app", contact);
        submitOrder.disabled = true;
        submitOrder.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim Notifikasi...';
        statusMessage.textContent = "";

        const messageText = 
            `🛒 *PESANAN APLIKASI BARU*\n` +
            `━━━━━━━━━━━━━━━━━━━━\n` +
            `📦 *Produk:* ${currentProduct.name}\n` +
            `⏳ *Periode:* ${parsePeriod(periodSelect.value)}\n` + 
            `🔢 *Jumlah:* ${quantity}\n` +
            `💳 *Pembayaran:* ${selectedMethod}\n` +
            `💰 *TOTAL TAGIHAN: ${totalPrice}*\n` +
            `━━━━━━━━━━━━━━━━━━━━\n` +
            `📞 *Kontak:* \`${contact}\``;

        try {
            const res = await fetch('/api/order', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: messageText })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                showToast("Pesanan terkirim! Admin akan memprosesnya.");
                setTimeout(() => closeModalFunc(), 2000);
            } else {
                throw new Error("Gagal");
            }
        } catch (error) {
            showToast("Gagal mengirim pesanan. Cek server/koneksi.", "error");
            submitOrder.disabled = false;
            submitOrder.innerHTML = "Coba Lagi";
        }
    });

    searchInput.addEventListener("input", () => renderProducts(searchInput.value));
    document.addEventListener('DOMContentLoaded', loadProducts);
</script>
</body>
</html>
