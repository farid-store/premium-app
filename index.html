<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Produk Premium | Farid Store</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 0;
        margin: 0;
        background: #f4f6f9;
        color: #333;
    }

    /* === Header & Breadcrumb === */
    header {
        background: linear-gradient(135deg, #7367f0 0%, #9b8cfb 100%);
        padding: 30px 20px;
        color: white;
        box-shadow: 0 4px 12px rgba(115, 103, 240, 0.2);
    }
    .header-content {
        max-width: 1200px;
        margin: 0 auto;
    }
    .header-content h2 { margin: 0; font-size: 1.8rem; }
    .breadcrumb { opacity: 0.9; font-size: 0.9rem; margin-top: 8px; }

    /* === Main Container === */
    .container {
        max-width: 1200px;
        margin: 20px auto;
        padding: 0 20px;
    }

    /* === Search Bar === */
    .search-wrapper {
        position: relative;
        max-width: 400px;
        margin-bottom: 25px;
    }
    .search-wrapper i {
        position: absolute;
        top: 50%;
        left: 15px;
        transform: translateY(-50%);
        color: #888;
    }
    .search-input {
        padding: 12px 15px 12px 40px;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease;
    }
    .search-input:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(115, 103, 240, 0.2);
        border-color: #7367f0;
    }

    /* === Grid Produk (Responsif) === */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
        gap: 20px;
    }
    .no-results {
        text-align: center; color: #888; font-style: italic; grid-column: 1 / -1; padding: 40px 0;
    }

    /* === Card Animasi === */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .card {
        animation: fadeInUp 0.5s ease forwards;
        background: white; border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        padding: 15px; text-align: center;
        display: flex; flex-direction: column; justify-content: space-between;
        cursor: pointer; transition: all 0.3s ease;
        border: 1px solid transparent;
    }
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(115, 103, 240, 0.15);
        border-color: rgba(115, 103, 240, 0.3);
    }
    .card img {
        width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
        border-radius: 8px; background: #f8f9fa; margin-bottom: 12px;
    }
    .card h4 {
        margin: 0 0 8px 0; font-size: 0.95rem; flex-grow: 1;
        display: flex; align-items: center; justify-content: center;
    }
    .price-tag {
        font-weight: 700; color: #7367f0; font-size: 1rem; margin-bottom: 10px;
    }
    .status {
        padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
        display: inline-block;
    }
    .status.ready { background-color: #e8f5e9; color: #2e7d32; }
    .status.pending { background-color: #fff8e1; color: #f57f17; }

    /* === Modal === */
    .modal {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
        justify-content: center; align-items: center;
        padding: 20px; z-index: 1000; opacity: 0; transition: opacity 0.3s ease;
    }
    .modal.show { display: flex; opacity: 1; }
    
    .modal-content {
        background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto;
        padding: 30px; position: relative; transform: scale(0.95); transition: transform 0.3s ease;
    }
    .modal.show .modal-content { transform: scale(1); }

    .modal-close {
        position: absolute; top: 15px; right: 20px; font-size: 24px;
        background: none; border: none; cursor: pointer; color: #888;
    }
    .modal-close:hover { color: #d32f2f; }

    .modal-body { display: flex; gap: 25px; flex-wrap: wrap; }
    .modal-image-wrapper { flex: 1 1 220px; display: flex; flex-direction: column; align-items: center; }
    .modal-image-wrapper img.prod-img { width: 100%; max-width: 220px; border-radius: 12px; object-fit: contain; background: #f8f9fa; margin-bottom: 15px; }
    
    /* === QRIS Wrapper Box di Modal === */
    .qris-box {
        background: white;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        display: inline-block;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        text-align: center;
    }
    #qrcode {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 180px;
        height: 180px;
        margin: 0 auto;
    }
    .qris-hint { font-size: 0.75rem; color: #666; margin-top: 6px; font-weight: 600; }

    .modal-details { flex: 1 1 320px; display: flex; flex-direction: column; }
    .modal-details h3 { margin: 0; font-size: 1.4rem; color: #333; }
    .modal-details .modal-price { font-size: 1.2rem; font-weight: 700; color: #7367f0; margin: 8px 0 15px 0; }
    
    .modal-details label { font-weight: 600; margin-top: 12px; color: #555; font-size: 0.9rem; }
    .modal-details select, .modal-details input {
        margin-top: 6px; padding: 10px; font-size: 0.95rem;
        border-radius: 8px; border: 1px solid #ccc; transition: all 0.3s;
        box-sizing: border-box; width: 100%;
    }
    .modal-details select:focus, .modal-details input:focus {
        outline: none; border-color: #7367f0; box-shadow: 0 0 0 3px rgba(115, 103, 240, 0.1);
    }

    .total-calc {
        background: #f8f9fa; border: 1px dashed #7367f0; padding: 12px; border-radius: 8px;
        margin-top: 15px; text-align: center; font-size: 1.1rem; font-weight: bold; color: #333;
    }

    .btn-submit {
        margin-top: 15px; padding: 12px; font-size: 1rem; font-weight: 700;
        background: #7367f0; color: white; border: none; border-radius: 8px;
        cursor: pointer; transition: background 0.3s ease;
    }
    .btn-submit:hover:not(:disabled) { background: #5a4fcc; }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

    .status-message { margin-top: 12px; font-weight: 600; text-align: center; font-size: 0.85rem; }
    .loading-state { text-align: center; padding: 40px; color: #888; grid-column: 1 / -1; }

    /* Responsive Modal Mobile */
    @media (max-width: 600px) {
        .modal-body { flex-direction: column; gap: 15px; }
        .modal-content { padding: 20px; }
        .modal-image-wrapper { flex: 1 1 auto; }
    }
</style>
</head>
<body>

<header>
    <div class="header-content">
        <h2>Aplikasi Premium</h2>
        <p class="breadcrumb">Prabayar &gt; Aplikasi & Jasa Premium</p>
    </div>
</header>

<div class="container">
    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Cari aplikasi atau layanan..." id="searchInput" class="search-input" />
    </div>
    
    <div id="productList" class="grid">
        <div class="loading-state"><i class="fas fa-spinner fa-spin fa-2x"></i><br>Memuat Katalog Harga...</div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <button id="closeModal" class="modal-close"><i class="fas fa-times"></i></button>
        <div class="modal-body">
            <div class="modal-image-wrapper">
                <img id="modalImage" class="prod-img" src="" alt="Produk" />
                
                <div class="qris-box">
                    <div id="qrcode"></div>
                    <div class="qris-hint"><i class="fas fa-qrcode"></i> QRIS OTOMATIS FARID STORE</div>
                </div>
            </div>
            
            <div class="modal-details">
                <h3 id="modalName">Nama Produk</h3>
                <div id="modalPrice" class="modal-price">Rp0</div>

                <label for="periodSelect">Periode Langganan:</label>
                <select id="periodSelect">
                    <option value="1hari">1 Hari</option>
                    <option value="7hari">7 Hari</option>
                    <option value="1bulan">1 Bulan</option>
                    <option value="3bulan">3 Bulan</option>
                    <option value="12bulan">12 Bulan</option>
                </select>

                <label for="quantityInput">Jumlah Pesanan:</label>
                <input type="number" id="quantityInput" min="1" value="1" />

                <label for="contactInput">Kontak Anda (WA/Telegram):</label>
                <input type="text" id="contactInput" placeholder="Contoh: 0812xxx atau @username" />

                <div class="total-calc">
                    Total Tagihan: <span id="totalDisplay">Rp0</span>
                </div>

                <button id="submitOrder" class="btn-submit">Konfirmasi Pesanan</button>
                <p id="statusMessage" class="status-message"></p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
    const productList = document.getElementById("productList");
    const searchInput = document.getElementById("searchInput");
    const modal = document.getElementById("modal");
    
    const modalImage = document.getElementById("modalImage");
    const modalName = document.getElementById("modalName");
    const modalPrice = document.getElementById("modalPrice");
    const periodSelect = document.getElementById("periodSelect");
    const quantityInput = document.getElementById("quantityInput");
    const contactInput = document.getElementById("contactInput");
    const totalDisplay = document.getElementById("totalDisplay");
    const submitOrder = document.getElementById("submitOrder");
    const statusMessage = document.getElementById("statusMessage");

    let items = [];
    let currentProduct = null;
    let qrEngine = null; // Menyimpan instance QRCode agar tidak tumpang tindih

    function formatRupiah(number) {
        return "Rp" + number.toLocaleString("id-ID");
    }

    // Algoritma Keamanan CRC16-CCITT Standar Internasional EMVCo QRIS
    function crc16(str) {
        let crc = 0xFFFF;
        for (let i = 0; i < str.length; i++) {
            crc ^= str.charCodeAt(i) << 8;
            for (let j = 0; j < 8; j++) {
                if ((crc & 0x8000) !== 0) {
                    crc = (crc << 1) ^ 0x1021;
                } else {
                    crc <<= 1;
                }
                crc &= 0xFFFF;
            }
        }
        return crc.toString(16).toUpperCase().padStart(4, '0');
    }

    // Konstruktor String Payload Penentu Nominal QRIS Dinamis Instan
    function buildQRIS(amount) {
        const tag00 = "000201";
        const tag01 = "010212"; // Kode 12 mengunci QRIS ke tipe Dinamis
        const tag26 = "26570011ID.DANA.WWW011893600915300002827902090000282790303UMI";
        const tag51 = "51440014ID.CO.QRIS.WWW0215ID10265066640140303UMI";
        const tag52 = "52044814";
        const tag53 = "5303360"; // Mata uang rupiah Indonesia (IDR)
        
        const amountStr = amount.toString();
        const amountLen = amountStr.length.toString().padStart(2, '0');
        const tag54 = "54" + amountLen + amountStr; // Mengasimilasi nominal transaksi
        
        const tag58 = "5802ID";
        const tag59 = "5911Farid Store";
        const tag60 = "6014Kota Pekanbaru";
        const tag61 = "610528294";
        const tag63Header = "6304"; 
        
        const rawPayload = tag00 + tag01 + tag26 + tag51 + tag52 + tag53 + tag54 + tag58 + tag59 + tag60 + tag61 + tag63Header;
        const finalCrc = crc16(rawPayload);
        
        return rawPayload + finalCrc;
    }

    // Sinkronisasi data katalog via Vercel Serverless internal proxy
    async function loadProducts() {
        try {
            const response = await fetch('/api/products');
            const data = await response.json();
            
            if (!response.ok) throw new Error(data.error || 'Server mengalami kendala.');
            
            const extractedData = extractArray(data);
            if (extractedData) {
                items = extractedData;
            } else {
                items = [];
                throw new Error("Sistem gagal memetakan struktur data array.");
            }
            
            renderProducts();
        } catch (error) {
            console.error("Error loadProducts:", error);
            productList.innerHTML = `<p class="no-results" style="color:#d32f2f;"><i class="fas fa-exclamation-triangle fa-2x mb-2 block"></i><br>Gagal memuat katalog: ${error.message}</p>`;
        }
    }

    function extractArray(data) {
        if (Array.isArray(data)) return data;
        if (data && Array.isArray(data.record)) return data.record;
        if (data && typeof data === 'object') {
            for (const key in data) {
                if (Array.isArray(data[key])) return data[key];
            }
        }
        return null;
    }

    function renderProducts(filter = "") {
        productList.innerHTML = "";
        const filtered = items.filter(item => item.name.toLowerCase().includes(filter.toLowerCase()));
        
        if (filtered.length === 0) {
            productList.innerHTML = '<p class="no-results"><i class="fas fa-box-open fa-2x mb-2 block"></i><br>Produk tidak ditemukan.</p>';
            return;
        }
        
        filtered.forEach((item) => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img src="${item.img}" alt="${item.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/150'" />
                <h4>${item.name}</h4>
                <div class="price-tag">${formatRupiah(item.price)}</div>
                <div><span class="status ${item.status}">${item.status === "ready" ? "Ready" : "Pending"}</span></div>
            `;
            card.addEventListener("click", () => openModal(item));
            productList.appendChild(card);
        });
    }

    // FUNGSI UTAMA: Menghitung total tagihan sekaligus me-render ulang QRIS otomatis secara real-time
    function calculateTotal() {
        if (!currentProduct) return;
        const qty = parseInt(quantityInput.value) || 1;
        const total = currentProduct.price * qty;
        totalDisplay.innerText = formatRupiah(total);

        // Regenerasi kode QRIS dinamis secara otomatis berdasarkan nominal total
        if (total > 0) {
            const qrisPayload = buildQRIS(total);
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = ""; // Bersihkan QR lawas
            
            qrEngine = new QRCode(qrContainer, {
                text: qrisPayload,
                width: 180,
                height: 180,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
        }
    }

    function openModal(product) {
        currentProduct = product;
        modalImage.src = product.img;
        modalName.textContent = product.name;
        modalPrice.textContent = formatRupiah(product.price);
        
        periodSelect.value = "1bulan";
        quantityInput.value = 1;
        
        const savedContact = localStorage.getItem("user_contact_app");
        contactInput.value = savedContact ? savedContact : "";
        
        calculateTotal(); // Trigger pembuatan QRIS otomatis pertama kali saat modal terbuka
        statusMessage.textContent = "";
        submitOrder.innerHTML = "Konfirmasi Pesanan";
        submitOrder.disabled = false;
        
        modal.classList.add("show");
    }

    function closeModalFunc() {
        modal.classList.remove("show");
    }

    document.getElementById("closeModal").addEventListener("click", closeModalFunc);
    window.addEventListener("click", e => { if (e.target === modal) closeModalFunc(); });
    
    // Pasang listener pemantau perubahan form input untuk kalkulasi & update QRIS otomatis
    quantityInput.addEventListener("input", calculateTotal);
    periodSelect.addEventListener("change", calculateTotal);

    function parsePeriod(value) {
        const match = value.match(/^(\d+)([a-zA-Z]+)$/);
        if (!match) return value;
        return `${match[1]} ${match[2].charAt(0).toUpperCase() + match[2].slice(1)}`;
    }

    submitOrder.addEventListener("click", async () => {
        const period = periodSelect.value;
        const quantity = parseInt(quantityInput.value) || 1;
        const contact = contactInput.value.trim();
        const totalPrice = formatRupiah(currentProduct.price * quantity);

        if (!contact) {
            statusMessage.style.color = "#d32f2f";
            statusMessage.innerHTML = "<i class='fas fa-exclamation-circle'></i> Mohon isi kontak Anda.";
            return;
        }

        localStorage.setItem("user_contact_app", contact);

        submitOrder.disabled = true;
        submitOrder.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim Notifikasi...';
        statusMessage.textContent = "";

        const messageText = 
            `🛒 *PESANAN APLIKASI BARU*\n` +
            `━━━━━━━━━━━━━━━━━━━━\n` +
            `📦 *Produk:* ${currentProduct.name}\n` +
            `💸 *Harga Satuan:* ${formatRupiah(currentProduct.price)}\n` +
            `⏳ *Periode:* ${parsePeriod(period)}\n` + 
            `🔢 *Jumlah:* ${quantity}\n` +
            `💰 *TOTAL TAGIHAN: ${totalPrice}*\n` +
            `━━━━━━━━━━━━━━━━━━━━\n` +
            `📞 *Kontak:* \`${contact}\``;

        try {
            const res = await fetch('/api/order', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: messageText })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                statusMessage.style.color = "#2e7d32";
                statusMessage.innerHTML = "<i class='fas fa-check-circle'></i> Notifikasi terkirim! Admin akan segera memproses akun Anda.";
                setTimeout(() => closeModalFunc(), 2500);
            } else {
                throw new Error("Gagal memproses via server gateway.");
            }
        } catch (error) {
            statusMessage.style.color = "#d32f2f";
            statusMessage.innerHTML = "<i class='fas fa-times-circle'></i> Gagal mengirim konfirmasi. Cek koneksi internet Anda.";
            submitOrder.disabled = false;
            submitOrder.innerHTML = "Coba Lagi";
        }
    });

    searchInput.addEventListener("input", () => {
        renderProducts(searchInput.value);
    });

    document.addEventListener('DOMContentLoaded', loadProducts);
</script>
</body>
</html>
